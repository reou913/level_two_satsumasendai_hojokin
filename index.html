<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<title>薩摩川内市 補助金・助成金さがし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F3F9;
    --surface: #FFFFFF;
    --field: #F1F3F9;
    --ink: #1A1C24;
    --sub: #6B7080;
    --line: #E3E6EF;
    --accent: #4C6EF5;
    --on-accent: #FFFFFF;
    --open: #0CA678;
    --open-bg: #E6FCF5;
    --check: #E8590C;
    --check-bg: #FFF4E6;
    --closed: #868E96;
    --closed-bg: #F1F3F5;
    --new: #E03131;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --surface: #1C1F26;
      --field: #262A33;
      --ink: #F1F3F9;
      --sub: #9AA0B0;
      --line: #2A2E38;
      --accent: #748FFC;
      --on-accent: #0E1430;
      --open: #38D9A9;
      --open-bg: #0E2A22;
      --check: #FFA94D;
      --check-bg: #33220F;
      --closed: #ADB5BD;
      --closed-bg: #2A2E38;
      --new: #FF8787;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  a { color: inherit; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 20px calc(48px + env(safe-area-inset-bottom)); }

  header.hero { background: var(--surface); border-radius: 32px; padding: 28px 24px 24px; }
  h1 { margin: 0; font-size: clamp(1.6rem, 6.4vw, 2.4rem); font-weight: 900; line-height: 1.25; letter-spacing: -.01em; }
  .lead { margin: 8px 0 0; color: var(--sub); }
  .summary { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 16px; font-size: .875rem; color: var(--sub); }
  .summary b { color: var(--ink); font-size: 1.25rem; font-weight: 900; margin-right: 2px; font-variant-numeric: tabular-nums; }
  .notice {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 16px;
    background: var(--check-bg);
    font-size: .875rem;
  }

  /* 絞り込み */
  .controls { background: var(--surface); border-radius: 24px; padding: 18px 20px; margin-top: 16px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--sub); }
  input[type="search"] {
    width: 100%;
    font-size: 16px;
    padding: 13px 16px 13px 44px;
    border: 2px solid transparent;
    border-radius: 16px;
    background: var(--field);
    outline: none;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  input::placeholder { color: var(--sub); }
  .group { margin-top: 14px; }
  .group-label { font-size: .8125rem; font-weight: 700; color: var(--sub); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: none;
    background: var(--field);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: .875rem;
    font-weight: 700;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .chip .n { font-weight: 500; opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .toggle-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: .9375rem; font-weight: 700; }
  .switch { position: relative; width: 46px; height: 28px; flex-shrink: 0; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

  .result-count { margin: 20px 4px 8px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .result-count button { border: none; background: none; color: var(--accent); font-weight: 700; font-size: .875rem; padding: 4px 0; }

  /* 一覧 */
  ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .item { background: var(--surface); border-radius: 20px; padding: 16px 18px; }
  .item-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .badge { font-size: .75rem; font-weight: 900; border-radius: 6px; padding: 2px 8px; }
  .s-open { color: var(--open); background: var(--open-bg); }
  .s-check { color: var(--check); background: var(--check-bg); }
  .s-closed { color: var(--closed); background: var(--closed-bg); }
  .new { color: var(--new); font-size: .75rem; font-weight: 900; }
  .target { font-size: .75rem; font-weight: 700; color: var(--sub); }
  .item h2 { margin: 0; font-size: 1.0625rem; font-weight: 700; line-height: 1.5; }
  .item h2 a { text-decoration: none; }
  .item h2 a:hover { text-decoration: underline; }
  .item h2 a::after { content: " ↗"; color: var(--sub); font-weight: 500; font-size: .875rem; }
  .meta { margin-top: 8px; display: grid; gap: 2px; font-size: .8125rem; color: var(--sub); }
  .meta .period { color: var(--ink); font-weight: 700; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .tag { font-size: .75rem; background: var(--field); border-radius: 6px; padding: 1px 8px; }
  .empty { background: var(--surface); border-radius: 20px; padding: 28px 20px; text-align: center; color: var(--sub); }

  .sources { margin-top: 24px; background: var(--surface); border-radius: 24px; padding: 20px 24px; font-size: .8125rem; color: var(--sub); }
  .sources h2 { margin: 0 0 6px; font-size: 1rem; color: var(--ink); }
  .sources ul { margin: 0; padding-left: 1.2em; }
  .sources a { color: var(--accent); }
  .ng { color: var(--new); font-weight: 700; }

  .error { background: var(--surface); border-radius: 24px; padding: 24px; border-left: 6px solid var(--new); }
  .error code { background: var(--field); padding: 1px 6px; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>薩摩川内市 補助金・助成金さがし</h1>
    <p class="lead">市と商工会議所のホームページから、補助金・助成金の情報を毎週自動で集めています。</p>
    <div class="summary" id="summary"></div>
    <p class="notice">ここに載っているのは各ページの見出しから自動で読み取った情報です。対象・金額・期限は、申し込む前に必ずリンク先のページで確かめてください。</p>
  </header>

  <section class="controls" aria-label="絞り込み">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="キーワード（例：住宅、創業）" aria-label="キーワードで探す">
    </div>
    <div class="group">
      <div class="group-label" id="targetLabel">だれ向け</div>
      <div class="chips" id="targets" role="group" aria-labelledby="targetLabel"></div>
    </div>
    <div class="group">
      <div class="group-label" id="catLabel">分野</div>
      <div class="chips" id="cats" role="group" aria-labelledby="catLabel"></div>
    </div>
    <label class="toggle-row">
      <span class="switch"><input type="checkbox" id="showClosed"><span></span></span>
      受付終了も表示する
    </label>
  </section>

  <div class="result-count" aria-live="polite">
    <span id="count"></span>
    <button type="button" id="reset" hidden>条件をリセット</button>
  </div>
  <ul class="list" id="list"></ul>

  <section class="sources" id="sources" aria-labelledby="srcTitle"></section>
</div>

<script>
(() => {
  const DATA_URL = "data/subsidies.json";
  const TARGETS = ["個人・家庭向け", "事業者向け", "団体向け"];
  const CLOSED = ["受付終了", "過去のお知らせ"];
  const NEW_DAYS = 30;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = s => String(s ?? "").normalize("NFKC").toLowerCase();
  const jpDate = iso => {
    if (!iso) return "";
    const [y, m, d] = iso.slice(0, 10).split("-").map(Number);
    return `${y}年${m}月${d}日`;
  };

  let data = null;
  const state = { q: "", target: "", cat: "", showClosed: false };

  // 前回ひらいたときの絞り込みを覚えておく（この端末だけ）
  try { Object.assign(state, JSON.parse(localStorage.getItem("subsidy-filter") || "{}"), { q: "" }); } catch (e) {}
  const remember = () => { try { localStorage.setItem("subsidy-filter", JSON.stringify({ target: state.target, cat: state.cat, showClosed: state.showClosed })); } catch (e) {} };

  function isNew(item) {
    if (!item.first_seen || !data.meta.initial || item.first_seen <= data.meta.initial) return false;
    return (Date.now() - Date.parse(item.first_seen)) / 864e5 <= NEW_DAYS;
  }

  function matches(item, ignore) {
    if (!state.showClosed && CLOSED.includes(item.status)) return false;
    if (ignore !== "target" && state.target && item.target !== state.target) return false;
    if (ignore !== "cat" && state.cat && !item.categories.includes(state.cat)) return false;
    if (state.q) {
      const hay = norm([item.title, item.org, item.target, item.categories.join(" "), item.period].join(" "));
      if (!norm(state.q).split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false;
    }
    return true;
  }

  function chips(box, values, current, key, ignore) {
    const counts = {};
    data.items.filter(i => matches(i, ignore)).forEach(i => {
      (key === "cat" ? i.categories : [i.target]).forEach(v => counts[v] = (counts[v] || 0) + 1);
    });
    box.innerHTML = [["", "すべて"], ...values.map(v => [v, v])].map(([v, label]) => {
      const n = v ? (counts[v] || 0) : data.items.filter(i => matches(i, ignore)).length;
      return `<button class="chip" type="button" data-v="${esc(v)}" aria-pressed="${v === current}">${esc(label)}<span class="n">${n}</span></button>`;
    }).join("");
    box.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      state[key] = b.dataset.v;
      remember();
      render();
    }));
  }

  function statusClass(s) {
    return s === "募集中" ? "s-open" : s === "要確認" ? "s-check" : "s-closed";
  }

  function card(item) {
    const meta = [];
    if (item.period) meta.push(`<span class="period">${esc(item.period)}</span>`);
    meta.push(`<span>${esc(item.org)}${item.updated ? `　ページ更新：${jpDate(item.updated)}` : ""}</span>`);
    const labels = (item.labels || []).filter(l => !/募集中|受付中|終了|締切/.test(l));
    return `
      <li class="item">
        <div class="item-top">
          <span class="badge ${statusClass(item.status)}">${esc(item.status === "要確認" ? "受付状況は要確認" : item.status)}</span>
          ${isNew(item) ? `<span class="new">新着</span>` : ""}
          <span class="target">${esc(item.target)}</span>
        </div>
        <h2><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a></h2>
        <div class="meta">${meta.join("")}</div>
        <div class="tags">${[...labels.map(l => l.replace(/_/g, "の")), ...item.categories].map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      </li>`;
  }

  function render() {
    const cats = [...new Set(data.items.flatMap(i => i.categories))]
      .sort((a, b) => (a === "その他") - (b === "その他") || data.items.filter(i => i.categories.includes(b)).length - data.items.filter(i => i.categories.includes(a)).length);
    if (state.cat && !cats.includes(state.cat)) state.cat = "";
    chips($("targets"), TARGETS, state.target, "target", "target");
    chips($("cats"), cats, state.cat, "cat", "cat");
    $("showClosed").checked = state.showClosed;

    const shown = data.items.filter(i => matches(i));
    $("count").textContent = `${shown.length}件`;
    $("reset").hidden = !(state.q || state.target || state.cat || state.showClosed);
    $("list").innerHTML = shown.length
      ? shown.map(card).join("")
      : `<li class="empty">条件に合う補助金が見つかりませんでした。キーワードを変えるか、「受付終了も表示する」をオンにしてみてください。</li>`;
  }

  function header() {
    const m = data.meta;
    const open = data.items.filter(i => i.status === "募集中").length;
    const fresh = data.items.filter(isNew).length;
    $("summary").innerHTML = `
      <span><b>${open}</b>件 募集中</span>
      <span><b>${data.items.length}</b>件 掲載</span>
      ${fresh ? `<span><b>${fresh}</b>件 新着</span>` : ""}
      <span>最終チェック：${jpDate(m.updated)}</span>`;
    $("sources").innerHTML = `
      <h2 id="srcTitle">情報を集めているページ</h2>
      <ul>${m.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>（${s.count}件）${s.ok ? "" : ` <span class="ng">前回は読み込めませんでした</span>`}</li>`).join("")}</ul>
      <p style="margin:8px 0 0">「だれ向け」と「分野」は、見出しの言葉から自動で付けた目安です。</p>`;
  }

  // 操作
  let timer = null;
  $("q").addEventListener("input", e => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 150);
  });
  $("showClosed").addEventListener("change", e => { state.showClosed = e.target.checked; remember(); render(); });
  $("reset").addEventListener("click", () => {
    Object.assign(state, { q: "", target: "", cat: "", showClosed: false });
    $("q").value = "";
    remember();
    render();
  });

  fetch(DATA_URL, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { data = d; header(); render(); })
    .catch(() => {
      document.querySelector(".controls").hidden = true;
      $("list").innerHTML = `<li class="error">
        <h2 style="font-size:1.125rem;margin:0 0 6px">データを読み込めませんでした</h2>
        <p style="margin:0">このページは <code>${DATA_URL}</code> を読み込んで表示します。ファイルをダブルクリックして開くと読み込めないので、GitHub PagesのURLか、Codespacesのプレビューで開いてください。</p>
      </li>`;
    });
})();
</script>
</body>
</html>
